<style>
/* Layout: ein Englisch-Schulheft (linierte Seite mit rotem Rand), darauf große Spielkarten wie Aufkleber */
:root {
  --paper: #EEF5FB;
  --line: #CFE0F1;
  --margin: #F2A3B3;
  --card: #FFFFFF;
  --ink: #1D2B4F;
  --muted: #5A6A8B;
  --sky: #2F6FD0;
  --sky-soft: #DCE9FA;
  --sun: #FFC83D;
  --sun-ink: #4A3500;
  --berry: #D93A63;
  --berry-soft: #FBE1E8;
  --leaf: #23935D;
  --leaf-soft: #DDF3E7;
  --shadow: 0 3px 0 rgba(29,43,79,.12);
  --display: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #142039; --line: #213152; --margin: #6B3346; --card: #1C2B4A;
    --ink: #EAF1FF; --muted: #A2B2D4; --sky: #78A9F5; --sky-soft: #24395F;
    --sun: #FFD25E; --sun-ink: #3A2A00; --berry: #FF7396; --berry-soft: #4A2234;
    --leaf: #52CF8F; --leaf-soft: #1B4232; --shadow: 0 3px 0 rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #142039; --line: #213152; --margin: #6B3346; --card: #1C2B4A;
  --ink: #EAF1FF; --muted: #A2B2D4; --sky: #78A9F5; --sky-soft: #24395F;
  --sun: #FFD25E; --sun-ink: #3A2A00; --berry: #FF7396; --berry-soft: #4A2234;
  --leaf: #52CF8F; --leaf-soft: #1B4232; --shadow: 0 3px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 0, transparent 34px, var(--margin) 34px, var(--margin) 36px, transparent 36px),
    repeating-linear-gradient(180deg, transparent 0, transparent 31px, var(--line) 31px, var(--line) 32px);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; }

/* Kopfzeile */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; }
.brand h1 { font-size: clamp(34px, 8vw, 48px); font-weight: 800; letter-spacing: -.5px; }
.brand h1 span { color: var(--berry); }
.brand small { color: var(--muted); font-weight: 700; }
.starbox {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--sun); color: var(--sun-ink);
  font-family: var(--display); font-weight: 800; font-size: 24px;
  padding: 4px 16px 2px; border-radius: 999px; box-shadow: var(--shadow);
  font-variant-numeric: tabular-nums;
}
.starbox.pop { animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.18); } }

.panel { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); border: 2px solid var(--line); }
.label { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Themen-Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 2px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 6px 14px; font-weight: 800; font-size: 15px;
}
.chip[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: var(--card); }

.progress { height: 14px; border-radius: 99px; background: var(--sky-soft); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--leaf); border-radius: 99px; transition: width .4s; }

/* Spiel-Kacheln */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.mode {
  text-align: left; border: none; border-radius: 18px; padding: 16px 16px 14px;
  background: var(--card); box-shadow: var(--shadow); border: 2px solid var(--line);
  display: flex; flex-direction: column; gap: 4px; min-height: 128px;
  transition: transform .12s;
}
.mode:hover { transform: translateY(-3px) rotate(-.6deg); }
.mode .ic { font-size: 34px; line-height: 1; }
.mode b { font-family: var(--display); font-size: 23px; font-weight: 800; }
.mode span { color: var(--muted); font-size: 15px; font-weight: 600; }

.settings { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toggle { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 12px; font-weight: 800; font-size: 15px; }
.toggle[aria-pressed="true"] { border-color: var(--sky); background: var(--sky-soft); }

/* Sticker */
.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.sticker {
  aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 2px dashed var(--line);
  display: grid; place-items: center; font-size: 30px; background: transparent; color: var(--muted);
}
.sticker.got { border: 3px solid var(--card); background: var(--sun); box-shadow: var(--shadow); transform: rotate(-6deg); }
.sticker.got:nth-child(even) { transform: rotate(5deg); }
.sticker small { display: block; max-width: 92%; overflow-wrap: anywhere; line-height: 1.1; font-size: 10px; font-weight: 800; color: var(--sun-ink); margin-top: -6px; }

/* Spielbildschirm */
.gamebar { display: flex; align-items: center; gap: 12px; }
.back { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 12px; font-weight: 800; }
.dots { flex: 1; display: flex; gap: 5px; flex-wrap: wrap; min-width: 0; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--sky-soft); border: 2px solid var(--line); }
.dots i.ok { background: var(--leaf); border-color: var(--leaf); }
.dots i.no { background: var(--berry); border-color: var(--berry); }
.dots i.now { border-color: var(--sky); transform: scale(1.25); }

.stage { display: flex; flex-direction: column; gap: 16px; align-items: stretch; }
.prompt {
  background: var(--card); border-radius: 22px; box-shadow: var(--shadow); border: 2px solid var(--line);
  padding: 26px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;
  min-width: 0;
}
.prompt .emo { font-size: 54px; line-height: 1; }
.prompt .word { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 7vw, 44px); overflow-wrap: anywhere; }
.prompt .hint { color: var(--muted); font-weight: 700; }
.say {
  border: none; background: var(--sky); color: var(--card); border-radius: 999px;
  padding: 8px 18px; font-weight: 800; display: inline-flex; gap: 6px; align-items: center;
}
.say.big { font-size: 22px; padding: 18px 30px; }

.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .opts { grid-template-columns: 1fr; } }
.opt {
  border: 3px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 12px;
  font-weight: 800; font-size: 19px; box-shadow: var(--shadow); min-height: 64px; overflow-wrap: anywhere;
}
.opt:hover:not(:disabled) { border-color: var(--sky); }
.opt.ok { background: var(--leaf-soft); border-color: var(--leaf); }
.opt.no { background: var(--berry-soft); border-color: var(--berry); animation: shake .35s; }
.opt:disabled { cursor: default; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.feedback { min-height: 30px; text-align: center; font-weight: 800; font-size: 19px; }
.feedback.ok { color: var(--leaf); }
.feedback.no { color: var(--berry); }

.actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn {
  border: none; border-radius: 14px; padding: 12px 22px; font-weight: 800; font-size: 18px;
  background: var(--sky); color: var(--card); box-shadow: var(--shadow);
}
.btn.sun { background: var(--sun); color: var(--sun-ink); }
.btn.leaf { background: var(--leaf); color: var(--card); }
.btn.berry { background: var(--berry); color: var(--card); }
.btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); }

/* Karteikarte */
.flip { perspective: 1000px; border: none; background: none; padding: 0; width: 100%; }
.flip-in { position: relative; min-height: 240px; transition: transform .5s; transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--card); border-radius: 22px; border: 2px solid var(--line); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 18px;
}
.face.back { transform: rotateY(180deg); background: var(--sky-soft); }
.face .word { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 7vw, 44px); text-align: center; overflow-wrap: anywhere; }
.face .emo { font-size: 50px; line-height: 1; }
.face .tap { color: var(--muted); font-weight: 700; font-size: 14px; }

/* Zuordnen */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tile {
  border: 3px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 8px;
  font-weight: 800; font-size: 17px; min-height: 58px; box-shadow: var(--shadow); overflow-wrap: anywhere;
}
.tile.sel { border-color: var(--sky); background: var(--sky-soft); }
.tile.done { border-color: var(--leaf); background: var(--leaf-soft); opacity: .55; }
.tile.no { border-color: var(--berry); animation: shake .35s; }

/* Buchstabieren */
.mask { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 24px; letter-spacing: .18em; font-weight: 700; color: var(--muted); overflow-wrap: anywhere; text-align: center; }
.spell { width: 100%; font: 800 26px var(--body); padding: 12px 16px; border-radius: 14px; border: 3px solid var(--line); background: var(--card); color: var(--ink); text-align: center; }
.spell.ok { border-color: var(--leaf); }
.spell.no { border-color: var(--berry); animation: shake .35s; }

/* Sprich mit! */
.mic {
  width: 112px; height: 112px; border-radius: 50%; border: 4px solid var(--card); background: var(--berry); color: var(--card);
  font-size: 50px; line-height: 1; box-shadow: var(--shadow); display: grid; place-items: center; transition: transform .12s;
}
.mic:hover:not(:disabled) { transform: scale(1.05); }
.mic.on { background: var(--leaf); animation: pulse 1.1s ease-out infinite; }
.mic:disabled { opacity: .4; cursor: default; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(35,147,93,.55); } 100% { box-shadow: 0 0 0 24px rgba(35,147,93,0); } }
.micnote { text-align: center; color: var(--muted); font-weight: 700; min-height: 24px; }
.heard { text-align: center; font-weight: 700; color: var(--muted); min-height: 24px; overflow-wrap: anywhere; }
.heard b { color: var(--ink); }

/* Ende */
.result { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.result .big { font-size: 70px; line-height: 1; }
.result h2 { font-size: clamp(32px, 8vw, 46px); }
.newsticker { background: var(--sun); color: var(--sun-ink); border-radius: 18px; padding: 14px 18px; font-weight: 800; box-shadow: var(--shadow); }
.newsticker .s { font-size: 46px; display: block; }

/* Wortliste */
.list { width: 100%; border-collapse: collapse; }
.list td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.list td.en { font-weight: 800; }
.list td.de { color: var(--muted); font-weight: 600; }
.list td.lvl { white-space: nowrap; font-size: 13px; color: var(--muted); }
.mini { border: none; background: var(--sky-soft); border-radius: 99px; width: 36px; height: 36px; font-size: 16px; }
.cathead { font-family: var(--display); font-size: 24px; margin: 14px 0 4px; }
.note { color: var(--muted); font-size: 14px; font-weight: 600; }

canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* Link zurück zur Auswahlseite */
.backbar { max-width: 760px; margin: 0 auto; padding-top: 14px; display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.homelink { color: var(--muted); font-weight: 800; font-size: 15px; text-decoration: none; border-bottom: 2px solid var(--line); padding-bottom: 2px; }
.homelink:hover { color: var(--ink); }
.homelink:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 6px; }
</style>
</head>

const STARS_PER_STICKER = 20;

/* ---------- Speicher (nur in diesem Browser) ---------- */
const KEY = "vokabeljagd-v1";
let S = { stars: 0, box: {}, slow: false, dir: "en", cat: "all" };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) S = Object.assign(S, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Hilfen ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const box = w => S.box[w.id] || 0;
function pool() { return S.cat === "all" ? WORDS : WORDS.filter(w => w.cat === S.cat); }
function pick(n, list) {
  list = list || pool();
  return list.map(w => ({ w, k: box(w) + Math.random() * 2.5 })).sort((a, b) => a.k - b.k).slice(0, n).map(x => x.w);
}
function grade(w, ok) {
  S.box[w.id] = ok ? Math.min(5, box(w) + 1) : Math.max(0, box(w) - 1);
  save();
}
function addStars(n) {
  const before = Math.floor(S.stars / STARS_PER_STICKER);
  S.stars += n; save();
  if (G) G.earned += n;
  const el = document.getElementById("stars");
  if (el) { el.textContent = "★ " + S.stars; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  if (Math.floor(S.stars / STARS_PER_STICKER) > before && G) G.newSticker = true;
}
const stickerCount = () => Math.min(ANIMALS.length, Math.floor(S.stars / STARS_PER_STICKER));

/* ---------- Aussprache ---------- */
const canSpeak = "speechSynthesis" in window;
/* Datenschutz: Es werden nur Stimmen genutzt, die auf dem Gerät laufen (localService).
   Online-Stimmen (z. B. die „Google“-Stimmen in Chrome) schicken den Text an den Browser-Hersteller;
   die gibt es nur, wenn das ausdrücklich erlaubt wurde, und nur bis zum Neuladen der Seite. */
let voice = null, voicesLoaded = false, onlineVoiceOK = false;
function findVoice() {
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  if (vs.length) voicesLoaded = true;
  const en = vs.filter(v => /^en/i.test(v.lang));
  const best = list => list.find(v => /^en[-_]GB/i.test(v.lang)) || list[0] || null;
  voice = best(en.filter(v => v.localService)) || (onlineVoiceOK ? best(en) : null);
}
if (canSpeak) { findVoice(); speechSynthesis.onvoiceschanged = () => { const had = !!voice; findVoice(); if (!G && !had && $app.querySelector(".modes")) home(); }; }
function speak(text, rate) {
  if (!canSpeak) return;
  if (!voice) findVoice();
  if (!voice) return;
  const t = text.replace(/…/g, " ").replace(/\s+/g, " ").trim();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "en-GB"; if (voice) u.voice = voice;
  u.rate = rate || (S.slow ? 0.6 : 0.9);
  speechSynthesis.speak(u);
}

/* ---------- Geräusche ---------- */
let ac = null;
function beep(ok) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 180];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = ok ? "triangle" : "sawtooth"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, ac.currentTime + i * 0.11);
      g.gain.exponentialRampToValueAtTime(ok ? 0.18 : 0.07, ac.currentTime + i * 0.11 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i * 0.11 + 0.18);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime + i * 0.11); o.stop(ac.currentTime + i * 0.11 + 0.2);
    });
  } catch (e) {}
}

/* ---------- Konfetti ---------- */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("confetti"); c.hidden = false;
  const x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#FFC83D", "#D93A63", "#2F6FD0", "#23935D", "#8E5BD9"];
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, a: Math.random() * 6, col: cols[Math.floor(Math.random() * cols.length)] }));
  let t = 0;
  (function step() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .15; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.col; x.fillRect(-4, -2 - p.r / 2, 8, 4 + p.r); x.restore(); });
    if (++t < 180) requestAnimationFrame(step); else { x.clearRect(0, 0, c.width, c.height); c.hidden = true; }
  })();
}

/* ---------- Spielrahmen ---------- */
function start(mode) {
  if (mode === "list") return wordList();
  if (mode === "talk" && !canListen) return noListen();
  if (mode === "talk" && !listenMode) return listenGate();
  G = { mode, i: 0, results: [], earned: 0, newSticker: false };
  if (mode === "cards") { G.items = pick(10); }
  if (mode === "quiz" || mode === "listen") { G.items = pick(10); }
  if (mode === "talk") { G.items = pick(8); }
  if (mode === "spell") { G.items = pick(8, pool().filter(w => w.en.length <= 22)); if (G.items.length < 3) G.items = pick(8, WORDS.filter(w => w.en.length <= 22)); }
  if (mode === "match") { G.items = [0, 1, 2]; }
  G.total = G.items.length;
  next();
}
function frame(inner) {
  stopListening();
  const dots = Array.from({ length: G.total }, (_, k) => `<i class="${G.results[k] === true ? "ok" : G.results[k] === false ? "no" : k === G.i ? "now" : ""}"></i>`).join("");
  $app.innerHTML = `<div class="gamebar"><button class="back" id="back">← Übersicht</button><div class="dots" aria-label="Fortschritt">${dots}</div>
    <div class="starbox" id="stars">★ ${S.stars}</div></div><section class="stage">${inner}</section>`;
  $app.querySelector("#back").onclick = home;
}
function next() {
  if (G.i >= G.total) return finish();
  ({ cards: cardRound, quiz: quizRound, listen: listenRound, talk: talkRound, match: matchRound, spell: spellRound })[G.mode]();
}
function done(ok) { G.results[G.i] = ok; G.i++; }

/* ---------- Karteikarten ---------- */
function cardRound() {
  const w = G.items[G.i];
  const front = S.dir === "en" ? w.en : w.de, back = S.dir === "en" ? w.de : w.en;
  frame(`<button class="flip" id="card" aria-label="Karte umdrehen">
      <div class="flip-in">
        <div class="face"><span class="emo">${w.emo}</span><span class="word">${esc(front)}</span><span class="tap">Tippen zum Umdrehen</span></div>

      </div></button>

  card.onclick = () => { card.classList.toggle("on"); $app.querySelector("#judge").hidden = false; if (card.classList.contains("on") && S.dir === "de") speak(w.en); };
  $app.querySelector("#say").onclick = () => speak(w.en);
  $app.querySelector("#yes").onclick = () => { grade(w, true); addStars(1); beep(true); done(true); next(); };
  $app.querySelector("#no").onclick = () => { grade(w, false); done(false); next(); };
  if (S.dir === "en") speak(w.en);
}

/* ---------- Quiz & Hören ---------- */
function distractors(w, key, n) {
  const same = shuffle(WORDS.filter(x => x.cat === w.cat && x[key] !== w[key]));
  const other = shuffle(WORDS.filter(x => x.cat !== w.cat && x[key] !== w[key]));
  const out = [], seen = new Set([w[key]]);
  for (const x of same.concat(other)) { if (!seen.has(x[key])) { seen.add(x[key]); out.push(x); } if (out.length >= n) break; }
  return out;
}
function choiceRound(w, promptHtml, key, onShow) {
  const opts = shuffle([w].concat(distractors(w, key, 3)));
  frame(`${promptHtml}
    <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o[key])}</button>`).join("")}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="actions"><button class="btn" id="go" hidden>Weiter →</button></div>`);
  const fb = $app.querySelector("#fb"), go = $app.querySelector("#go");
  go.onclick = next;
  $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const o = opts[+b.dataset.k], ok = o === w;
    $app.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (opts[+x.dataset.k] === w) x.classList.add("ok"); });
    grade(w, ok); done(ok);
    if (ok) {
      addStars(1); beep(true);
      fb.className = "feedback ok"; fb.textContent = praise() + "  " + w.en + " = " + w.de;
      speak(w.en);
      setTimeout(() => { if (G && G.results.length === G.i && $app.contains(go)) next(); }, 1500);
    } else {
      b.classList.add("no"); beep(false);
      fb.className = "feedback no"; fb.textContent = "Fast! Richtig ist: " + w.en + " = " + w.de;
      go.hidden = false; speak(w.en);
    }
  });
  if (onShow) onShow();
}
function quizRound() {
  const w = G.items[G.i];
  const en = S.dir === "en";
  choiceRound(w, `<div class="prompt"><span class="emo">${w.emo}</span><span class="word">${esc(en ? w.en : w.de)}</span>
      <span class="hint">${en ? "Was heißt das auf Deutsch?" : "Wie heißt das auf Englisch?"}</span>
      ${en ? `<button class="say" id="say">🔊 Anhören</button>` : ""}</div>`, en ? "de" : "en", () => {
    const s = $app.querySelector("#say"); if (s) { s.onclick = () => speak(w.en); speak(w.en); }
  });
}
function listenRound() {
  const w = G.items[G.i];

      <span class="hint">Welches Wort hörst du?</span>

    $app.querySelector("#say").onclick = () => speak(w.en);
    $app.querySelector("#sl").onclick = () => speak(w.en, 0.5);
    setTimeout(() => speak(w.en), 250);
  });
}
const PRAISE = ["Super!", "Klasse!", "Great!", "Well done!", "Toll!", "Fantastic!", "Yes!", "Prima!"];
const praise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];

/* ---------- Paare finden ---------- */
function matchRound() {
  let src = pool(); if (src.length < 5) src = WORDS;
  const ws = pick(5, src);
  const left = shuffle(ws), right = shuffle(ws);
  let sel = null, found = 0, mistakes = 0;
  frame(`<div class="prompt" style="padding:16px"><span class="word" style="font-size:28px">Finde die Paare!</span><span class="hint">Tippe ein englisches Wort und dann die deutsche Übersetzung.</span></div>
    <div class="match"><div class="col">${left.map((w, k) => `<button class="tile" data-side="l" data-k="${k}">${esc(w.en)}</button>`).join("")}</div>
    <div class="col">${right.map((w, k) => `<button class="tile" data-side="r" data-k="${k}">${esc(w.de)}</button>`).join("")}</div></div>
    <div class="feedback" id="fb" aria-live="polite"></div>`);
  const fb = $app.querySelector("#fb");
  const wordOf = t => (t.dataset.side === "l" ? left : right)[+t.dataset.k];
  $app.querySelectorAll(".tile").forEach(t => t.onclick = () => {
    if (t.classList.contains("done")) return;
    if (t.dataset.side === "l") speak(wordOf(t).en);
    if (!sel || sel.dataset.side === t.dataset.side) {
      if (sel) sel.classList.remove("sel");
      sel = t; t.classList.add("sel"); return;
    }
    const a = wordOf(sel), b = wordOf(t);
    if (a === b) {
      [sel, t].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; });
      grade(a, true); addStars(1); beep(true); found++;
      fb.className = "feedback ok"; fb.textContent = a.en + " = " + a.de;
      if (found === 5) { done(mistakes <= 2); fb.textContent = mistakes === 0 ? "Perfekt, ohne Fehler!" : praise(); setTimeout(() => { if (G && G.mode === "match") next(); }, 1200); }
    } else {
      mistakes++; beep(false);
      [sel, t].forEach(x => { x.classList.remove("sel"); x.classList.add("no"); setTimeout(() => x.classList.remove("no"), 400); });
      fb.className = "feedback no"; fb.textContent = "Das passt nicht. Versuch's nochmal!";
    }
    sel = null;
  });
}

/* ---------- Buchstabieren ---------- */
const norm = s => s.toLowerCase().replace(/[’`´]/g, "'").replace(/…|\.\.\.|[?!.,]/g, " ").replace(/\s+/g, " ").trim();
function spellRound() {
  const w = G.items[G.i];
  const target = norm(w.en);
  let tries = 0, hints = 0;
  const mask = shown => target.split("").map((ch, k) => /[a-z]/.test(ch) ? (k < shown ? ch : "_") : ch).join("");
  frame(`<div class="prompt"><span class="emo">${w.emo}</span><span class="word">${esc(w.de)}</span>
      <span class="hint">Schreib es auf Englisch!</span>
      <div class="mask" id="mask">${esc(mask(0))}</div></div>
    <form id="f" class="stage" autocomplete="off">
      <input class="spell" id="inp" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Englisches Wort">
      <div class="actions">
        <button type="button" class="btn ghost" id="hint">💡 Tipp</button>
        <button type="button" class="btn ghost" id="say">🔊 Anhören</button>
        <button type="submit" class="btn sun">Prüfen ✓</button>
      </div>
    </form>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="actions"><button class="btn" id="go" hidden>Weiter →</button></div>`);
  const inp = $app.querySelector("#inp"), fb = $app.querySelector("#fb"), go = $app.querySelector("#go");
  inp.focus();
  go.onclick = next;
  $app.querySelector("#say").onclick = () => { hints++; speak(w.en); inp.focus(); };
  $app.querySelector("#hint").onclick = () => {
    hints++;
    const cur = norm(inp.value); let k = 0;
    while (k < cur.length && cur[k] === target[k]) k++;
    let end = k + 1; while (end < target.length && !/[a-z]/.test(target[end - 1])) end++;
    inp.value = target.slice(0, Math.min(end, target.length));
    $app.querySelector("#mask").textContent = mask(inp.value.length);
    inp.focus();
  };
  $app.querySelector("#f").onsubmit = e => {
    e.preventDefault();
    if (!go.hidden) return next();
    const v = norm(inp.value);
    if (!v) return;
    const ok = v === target, nearly = !ok && v.replace(/'/g, "") === target.replace(/'/g, "");
    if (ok || nearly) {
      inp.className = "spell ok"; inp.disabled = true; beep(true);
      grade(w, true); done(true); addStars(hints === 0 && tries === 0 ? 2 : 1);
      fb.className = "feedback ok";
      fb.textContent = nearly ? "Fast perfekt! Denk an den Apostroph: " + w.en.replace(/…/g, "").trim() : praise() + (hints === 0 && tries === 0 ? "  +2 ★" : "");
      speak(w.en); go.hidden = false; go.focus();
    } else {
      tries++; beep(false);
      inp.className = "spell no"; setTimeout(() => inp.className = "spell", 400);
      if (tries >= 3) {
        grade(w, false); done(false); inp.disabled = true;
        fb.className = "feedback no"; fb.textContent = "So schreibt man es: " + w.en.replace(/…/g, "").trim();
        speak(w.en); go.hidden = false; go.focus();
      } else {
        fb.className = "feedback no"; fb.textContent = tries === 1 ? "Noch nicht ganz. Versuch's nochmal!" : "Tipp: Hol dir einen Buchstaben mit 💡";
      }
    }
  };
}

/* ---------- Sprich mit! (Spracherkennung des Browsers) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canListen = !!SR;
let rec = null;
/* Datenschutz: Zuerst wird versucht, die Sprache auf dem Gerät zu erkennen (processLocally, Chrome ab 139).
   Dann verlässt keine Aufnahme das Gerät. Geht das nicht, nutzt der Browser einen Online-Dienst seines
   Herstellers; das passiert nur nach ausdrücklicher Zustimmung und nur bis zum Neuladen der Seite. */
let listenMode = null;            /* { local: true|false, lang } */
const LOCAL_LANGS = ["en-GB", "en-US"];
async function localSpeech() {
  if (typeof SR.available !== "function") return null;
  let later = null;
  for (const lang of LOCAL_LANGS) {
    try {
      const a = await SR.available({ langs: [lang], processLocally: true });
      if (a === "available") return { lang, state: a };
      if (!later && (a === "downloadable" || a === "downloading")) later = { lang, state: a };
    } catch (e) {}
  }
  return later;
}
function gateFrame(inner) {
  G = null; stopListening();
  $app.innerHTML = `<div class="gamebar"><button class="back" id="back">← Übersicht</button><div style="flex:1"></div><div class="starbox" id="stars">★ ${S.stars}</div></div>
    <section class="panel result">${inner}</section>`;
  $app.querySelector("#back").onclick = home;
}
function listenOnline() {
  gateFrame(`<span class="big" aria-hidden="true">🎤</span><h2>Kurz fragen: Mama, Papa?</h2>
    <p style="margin:0;max-width:36em">Auf diesem Gerät kann der Browser Sprache nur mit einem <b>Online-Dienst</b> erkennen.
    Wenn du aufs Mikrofon tippst, schickt der Browser die Aufnahme an seinen Hersteller (bei Chrome an Google, bei Edge an Microsoft, bei Safari an Apple).
    Diese Seite selbst speichert und verschickt keine Aufnahmen.</p>
    <p class="note" style="margin:0">Für Eltern: Mehr dazu unter <a href="../../datenschutz.html">Datenschutz</a>. Die Erlaubnis gilt nur, bis die Seite neu geladen wird.</p>
    <div class="actions"><button class="btn ghost" id="no">Lieber nicht</button><button class="btn" id="yes">Einverstanden</button></div>`);
  $app.querySelector("#no").onclick = home;
  $app.querySelector("#yes").onclick = () => { listenMode = { local: false, lang: "en-GB" }; start("talk"); };
}
async function listenGate() {
  gateFrame(`<span class="big" aria-hidden="true">🎤</span><h2>Einen Moment …</h2><p style="margin:0">Ich schaue, ob dein Gerät Sprache selbst erkennen kann.</p>`);
  const loc = await localSpeech();
  if (G || !$app.querySelector(".result")) return;         /* inzwischen woanders hin getippt */
  if (loc && loc.state === "available") { listenMode = { local: true, lang: loc.lang }; return start("talk"); }
  if (!loc) return listenOnline();
  gateFrame(`<span class="big" aria-hidden="true">🎤</span><h2>Einmal das Sprachpaket laden</h2>
    <p style="margin:0;max-width:36em">Dein Browser kann Sprache auch <b>direkt auf diesem Gerät</b> erkennen. Dann geht keine Aufnahme ins Internet.
    Dafür braucht er einmalig ein Sprachpaket für Englisch.</p>
    <p class="note" id="inote" style="margin:0" aria-live="polite"></p>
    <div class="actions"><button class="btn ghost" id="online">Ohne Sprachpaket</button><button class="btn" id="inst">Sprachpaket laden</button></div>`);
  $app.querySelector("#online").onclick = listenOnline;
  $app.querySelector("#inst").onclick = async e => {
    const b = e.currentTarget, note = $app.querySelector("#inote");
    b.disabled = true; note.textContent = "Wird geladen … das kann eine Weile dauern.";
    let ok = false;
    try { ok = await SR.install({ langs: [loc.lang], processLocally: true }); } catch (err) { ok = false; }
    if (!$app.querySelector("#inote")) return;
    const again = ok ? await localSpeech() : null;
    if (again && again.state === "available") { listenMode = { local: true, lang: again.lang }; return start("talk"); }
    b.disabled = false; note.textContent = "Das Sprachpaket ließ sich nicht laden. Versuch es später nochmal oder nimm „Ohne Sprachpaket“.";
  };
}
function stopListening() {
  if (!rec) return;
  const r = rec; rec = null;
  r.onresult = r.onerror = r.onend = null;
  try { r.abort(); } catch (e) {}
}
/* Wörter, die gleich klingen, zählen als gleich (die Erkennung schreibt z. B. "two" statt "too") */
const SOUNDS_SAME = [
  ["too", "two", "to", "2"], ["for", "four", "fore", "4"], ["are", "r"], ["right", "write", "rite"],
  ["son", "sun"], ["here", "hear"], ["new", "knew"], ["okay", "ok"], ["mum", "mom", "mam", "mummy"],
  ["mr", "mister"], ["mrs", "missus", "misses", "missis"], ["favourite", "favorite"], ["why", "y"],
  ["i", "eye"], ["be", "bee"], ["one", "won", "1"], ["no", "know"], ["in", "inn"], ["hi", "hiya"],
  ["grandma", "granma", "grandmother"], ["grandpa", "granpa", "grandfather"], ["dad", "daddy"],
  ["inline", "in line"], ["mobile", "mobil"]
];
const SAME_MAP = {};
SOUNDS_SAME.forEach(g => g.forEach(x => { if (!x.includes(" ")) SAME_MAP[x] = g[0]; }));
function canon(s) {
  s = String(s).toLowerCase().replace(/[’`´]/g, "'").replace(/…|\.\.\./g, " ");
  s = s.replace(/\blet's\b/g, "let us").replace(/n't\b/g, " not").replace(/'re\b/g, " are").replace(/'m\b/g, " am")
       .replace(/'s\b/g, " is").replace(/'ll\b/g, " will").replace(/'ve\b/g, " have");
  s = s.replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  return s ? s.split(" ").map(x => SAME_MAP[x] || x).join(" ") : "";
}
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const t = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = t;
    }
  }
  return d[b.length];
}
/* 1 = genau getroffen, 0 = ganz anders (Vergleich der Buchstaben, Leerzeichen egal) */
function sim(a, b) {
  a = a.replace(/ /g, ""); b = b.replace(/ /g, "");
  if (!a || !b) return 0;
  return 1 - lev(a, b) / Math.max(a.length, b.length);
}
/* Vergleicht das Zielwort mit allem, was die Erkennung verstanden haben könnte.
   Ein Treffer zählt auch, wenn das Wort in einem längeren Satz steckt ("the kitchen", "I like pizza"). */
function judgeSpeech(target, alts) {
  const t0 = canon(target), targets = [t0];
  /* "picture" reicht für "a picture", "bring" für "to bring" */
  const short = t0.replace(/^(a|an|the|too) (?=\S)/, "");
  if (short !== t0) targets.push(short);
  let best = { s: 0, heard: alts[0] || "" };
  alts.forEach(h => {
    const c = canon(h), cw = c.split(" ");
    targets.forEach(t => {
      const tn = t.split(" ").length;
      let s = sim(t, c);
      for (let k = 0; k + tn <= cw.length; k++) s = Math.max(s, sim(t, cw.slice(k, k + tn).join(" ")));
      if (s > best.s + 1e-9) best = { s, heard: h };
    });
  });
  return best;
}
function noListen() {
  G = null; stopListening();
  $app.innerHTML = `<div class="gamebar"><button class="back" id="back">← Übersicht</button><div style="flex:1"></div><div class="starbox" id="stars">★ ${S.stars}</div></div>
    <section class="panel result"><span class="big" aria-hidden="true">🎤</span><h2>Hier geht das leider nicht</h2>
    <p style="margin:0;max-width:34em">Dieser Browser kann keine Sprache erkennen. „Sprich mit!“ funktioniert in <b>Chrome</b>, <b>Edge</b> und <b>Safari</b> (auf iPhone und iPad muss Siri eingeschaltet sein). Firefox kann es noch nicht.</p>
    <div class="actions"><button class="btn ghost" id="home">Zur Übersicht</button></div></section>`;
  $app.querySelector("#back").onclick = home;
  $app.querySelector("#home").onclick = home;
}
const MIC_ERR = {
  "not-allowed": "Das Mikrofon ist gesperrt. Erlaube den Zugriff aufs Mikrofon (meist über das Symbol links neben der Adresse) und versuch es nochmal.",
  "service-not-allowed": "Die Spracherkennung ist ausgeschaltet. Auf iPhone und iPad muss dafür Siri eingeschaltet sein.",
  "audio-capture": "Ich finde kein Mikrofon. Ist eins angeschlossen?",
  "network": "Für die Spracherkennung braucht der Browser Internet. Bist du online?",
  "no-speech": "Ich habe nichts gehört. Tippe aufs Mikrofon und sprich laut und deutlich.",
  "language-not-supported": "Das Sprachpaket fehlt noch. Geh zur Übersicht und starte „Sprich mit!“ nochmal."
};
function talkRound() {
  const w = G.items[G.i];
  const target = w.en.replace(/…/g, " ").replace(/\s+/g, " ").trim();
  const en = S.dir === "en";
  let tries = 0, finished = false;
  frame(`<div class="prompt"><span class="emo">${w.emo}</span>
      <span class="word" id="tw">${esc(en ? w.en : w.de)}</span>
      <span class="hint" id="th">${en ? esc(w.de) : "Sag es auf Englisch!"}</span>
      <button class="say" id="say">${en ? "🔊 Vorsprechen" : "💡 Hilfe: anhören"}</button></div>
    <div class="actions"><button class="mic" id="mic" aria-label="Mikrofon: jetzt sprechen"><span aria-hidden="true">🎤</span></button></div>
    <div class="micnote" id="note" aria-live="polite">Tippe aufs Mikrofon und sag es laut.</div>
    <div class="note" style="text-align:center">${listenMode.local ? "🔒 Deine Stimme bleibt auf diesem Gerät." : "Die Aufnahme geht zur Erkennung an den Browser-Hersteller."}</div>
    <div class="heard" id="heard"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="actions"><button class="btn ghost" id="skip">Überspringen</button><button class="btn" id="go" hidden>Weiter →</button></div>`);
  const mic = $app.querySelector("#mic"), note = $app.querySelector("#note"), heard = $app.querySelector("#heard");
  const fb = $app.querySelector("#fb"), go = $app.querySelector("#go"), skip = $app.querySelector("#skip");
  const reveal = () => { if (!en) { $app.querySelector("#tw").textContent = w.en; $app.querySelector("#th").textContent = w.de; } };
  $app.querySelector("#say").onclick = () => { stopListening(); mic.classList.remove("on"); reveal(); speak(target); };
  go.onclick = next;
  skip.onclick = () => { stopListening(); done(false); next(); };
  const end = ok => {
    finished = true; mic.disabled = true; skip.hidden = true; go.hidden = false; go.focus();
    done(ok); reveal();
  };
  function showHeard(text) {
    heard.innerHTML = "";
    if (!text) return;
    heard.append("Ich habe verstanden: ");
    const b = document.createElement("b"); b.textContent = "„" + text + "“"; heard.append(b);
  }
  function onHeard(alts) {
    const r = judgeSpeech(target, alts);
    tries++;
    showHeard(r.heard);
    if (r.s >= 0.999) {
      beep(true); grade(w, true); addStars(tries === 1 ? 2 : 1);
      fb.className = "feedback ok"; fb.textContent = praise() + (tries === 1 ? "  +2 ★" : "  +1 ★");
      note.textContent = "Der Computer hat dich genau verstanden.";
      end(true);
    } else if (tries >= 3) {
      beep(false);
      fb.className = "feedback no"; fb.textContent = "Kein Problem! Das üben wir später nochmal.";
      note.textContent = "Hör gut zu, so klingt es:";
      end(false); setTimeout(() => speak(target), 400);
    } else {
      beep(false);
      fb.className = "feedback no";
      fb.textContent = r.s >= 0.7 ? "Fast! Sag es nochmal ganz deutlich." : "Hmm, das klang anders. Hör es dir an und versuch's nochmal!";
      note.textContent = "Noch " + (3 - tries) + (3 - tries === 1 ? " Versuch" : " Versuche") + ". Tippe aufs Mikrofon.";
    }
  }
  mic.onclick = () => {
    if (finished) return;
    if (rec) { stopListening(); mic.classList.remove("on"); note.textContent = "Tippe aufs Mikrofon und sag es laut."; return; }
    if (canSpeak) speechSynthesis.cancel();
    const r = new SR();
    r.lang = listenMode.lang; if (listenMode.local) r.processLocally = true; r.interimResults = false; r.continuous = false; r.maxAlternatives = 5;
    let got = false, failed = false;
    r.onresult = e => {
      got = true;
      const res = e.results[e.results.length - 1], alts = [];
      for (let k = 0; k < res.length; k++) alts.push(res[k].transcript);
      onHeard(alts);
    };
    r.onerror = e => {
      if (e.error === "aborted") return;
      failed = true;
      if (e.error === "language-not-supported") listenMode = null;
      note.textContent = MIC_ERR[e.error] || "Das hat nicht geklappt. Versuch es nochmal.";
    };
    r.onend = () => {
      if (rec === r) rec = null;
      mic.classList.remove("on");
      if (!got && !failed && !finished) note.textContent = MIC_ERR["no-speech"];
    };
    rec = r;
    try { r.start(); } catch (e) { rec = null; note.textContent = "Das Mikrofon startet gerade nicht. Versuch es gleich nochmal."; return; }
    mic.classList.add("on"); fb.textContent = ""; heard.innerHTML = "";
    note.textContent = "Ich höre zu … sprich jetzt!";
  };
  if (en) setTimeout(() => { if (G && G.mode === "talk" && !rec) speak(target); }, 250);
}

/* ---------- Ende ---------- */
function finish() {
  stopListening();
  const ok = G.results.filter(Boolean).length;
  const bonus = ok === G.total ? 5 : ok >= G.total * .7 ? 3 : 1;
  addStars(bonus);
  const n = stickerCount(), a = ANIMALS[n - 1];
  const great = ok >= G.total * .7;
  $app.innerHTML = header() + `<section class="panel result">
    <span class="big" aria-hidden="true">${ok === G.total ? "🏆" : great ? "🌟" : "💪"}</span>
    <h2>${ok === G.total ? "Alles richtig!" : great ? "Sehr gut gemacht!" : "Weiter so!"}</h2>
    <p style="font-size:20px;font-weight:800;margin:0">${ok} von ${G.total} richtig · +${G.earned} ★</p>
    ${G.newSticker && a ? `<div class="newsticker"><span class="s">${a[0]}</span>Neuer Sticker: <b>a ${a[1]}</b> (${a[2]})</div>` : ""}
    <div class="actions"><button class="btn sun" id="again">Nochmal spielen</button><button class="btn ghost" id="home">Zur Übersicht</button></div>
  </section>`;
  const mode = G.mode;
  $app.querySelector("#again").onclick = () => start(mode);
  $app.querySelector("#home").onclick = home;
  if (G.newSticker && a) speak("a " + a[1]);
  if (great) confetti();
}

/* ---------- Wortliste ---------- */
function wordList() {
  G = null; stopListening();
  const cats = S.cat === "all" ? Object.keys(CATS) : [S.cat];
  const lvl = w => box(w) >= 3 ? "✅ sicher" : box(w) > 0 ? "🙂 " + box(w) + "/3" : "neu";
  $app.innerHTML = `<div class="gamebar"><button class="back" id="back">← Übersicht</button><div style="flex:1"></div><div class="starbox" id="stars">★ ${S.stars}</div></div>
    <section class="panel"><h2 style="font-size:30px">Wortliste</h2>
    <p class="note">Abgeschrieben aus dem Heft. Tippe auf 🔊, um ein Wort zu hören.</p>
    ${cats.map(c => `<h3 class="cathead">${CATS[c].icon} ${CATS[c].name}</h3><div style="overflow-x:auto"><table class="list"><tbody>
      ${WORDS.filter(w => w.cat === c).map(w => `<tr><td style="width:44px"><button class="mini" data-id="${esc(w.id)}" aria-label="Anhören">🔊</button></td><td class="en">${esc(w.en)}</td><td class="de">${esc(w.de)}</td><td class="lvl">${lvl(w)}</td></tr>`).join("")}
    </tbody></table></div>`).join("")}
    </section>`;
  $app.querySelector("#back").onclick = home;
  $app.querySelectorAll("[data-id]").forEach(b => b.onclick = () => speak(WORDS.find(w => w.id === b.dataset.id).en));
}

home();
</script>
